name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftp
        timeout: 180000
        server-dir: ./public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/scratch/**
          **/_BACKUP_*/**
          .env
          database.json
          *.zip
          *.bat
          *.md
          *log*.txt
          patch*.js
          patch_*.js
          temp*.js
          scratch_*.js
          fix*.js
          test_*.js
          update_*.js
          print_*.js
          inject_*.js
          extract_*.js
          add_error_box.js
          check_render.js
          find_original.js
          fixSyntax.js
          link_client_script.js
          migrate.js
          script.js
          backup_dados.js
          backups/**
          chat_uploads_privado/**
          old_index.html
          page-base-clean.html
          page-base-restored.html
          public/portal-anterior.html
          Roteiros/**
